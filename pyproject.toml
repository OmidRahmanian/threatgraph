[project]
name = "threatgraph"
version = "0.1.0"
description = "ThreatGraph AI: explainable behavioral anomaly detection on authentication graphs (LANL 2015 compatible)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "joblib>=1.4",
  "numpy>=1.26",
  "polars>=1.20",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
threatgraph-live = "threatgraph_live.cli:main"
threatgraph-agent = "threatgraph.live.agent:main"
threatgraph-probe = "threatgraph.live.probe:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/threatgraph", "apps/api/threatgraph_api", "apps/live/threatgraph_live"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is enforced by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["threatgraph", "threatgraph_api", "threatgraph_live", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["packages/threatgraph", "apps/api/threatgraph_api", "apps/live/threatgraph_live"]
explicit_package_bases = true
mypy_path = ["packages", "apps/api", "apps/live"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
