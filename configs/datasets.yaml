# Dataset definitions. Paths are relative to the repository root (absolute paths also work).
# Day boundaries are relative days since the dataset's arbitrary epoch (LANL publishes
# relative seconds, not calendar time), so "day 3" means seconds [259200, 345600).

datasets:
  demo:
    mode: synthetic
    description: >-
      Deterministic synthetic fixture in the exact LANL auth/redteam text format.
      Every event, anomaly and red-team label is generated by scripts/generate_demo_data.py.
    raw_dir: data/demo/raw
    files:
      auth: auth.txt.gz
      redteam: redteam.txt.gz
      proc: proc.txt.gz
    processed_dir: data/processed/demo
    artifacts_dir: artifacts/demo
    time_window: { start_seconds: 0, end_seconds: null }
    ingest: { block_size_bytes: 4194304, assume_sorted: true, hash_source_files: true }
    redteam: { user_field: source }
    features: { window_seconds: 3600, burst_seconds: 300, baseline_windows: 24, principals: users_only }
    graph: { hub_max_principals: 15, sample_events_per_edge: 3, export_max_edges: 60 }
    splits: { warmup_end_day: 2, train_end_day: 8, validation_end_day: 11, test_end_day: 14 }
    seed: 42

  lanl:
    mode: lanl
    description: >-
      LANL Comprehensive, Multi-Source Cyber-Security Events (Kent, 2015). Files must be
      downloaded by the user from https://csr.lanl.gov/data/cyber1/ after completing LANL's
      data-use form, then placed in raw_dir. Never commit or redistribute these files.
    raw_dir: data/raw/lanl
    files:
      auth: auth.txt.gz
      redteam: redteam.txt.gz
      # Optional: uncomment after downloading proc.txt.gz from the same LANL page to enable the
      # process features and model M4. Without it, M4 is skipped with the reason recorded.
      # proc: proc.txt.gz
    processed_dir: data/processed/lanl
    artifacts_dir: artifacts/lanl
    # Bounded subset. Run `python scripts/ingest_lanl.py --inspect-redteam` first to see which
    # days contain red-team records, then choose a window and split days that give every
    # evaluated split known positives. These defaults are a starting point, not verified values.
    time_window: { start_seconds: 0, end_seconds: 1209599 }
    ingest: { block_size_bytes: 67108864, assume_sorted: true, hash_source_files: false }
    redteam: { user_field: source }
    # One-hour chunks bound feature/graph memory (LANL has roughly 18M events per day).
    # See docs/real_data.md for the scale rehearsal behind this choice.
    features:
      { window_seconds: 3600, burst_seconds: 300, baseline_windows: 24, principals: users_only,
        chunk_seconds: 3600 }
    graph: { hub_max_principals: 15, sample_events_per_edge: 3, export_max_edges: 60 }
    splits: { warmup_end_day: 2, train_end_day: 8, validation_end_day: 11, test_end_day: 14 }
    seed: 42

  # Smoke run on the real files: the first four days only. It exists to measure ingest
  # throughput, memory and data quality on real LANL data before the full window, not to
  # report detection performance (its validation and test days may hold no red-team records,
  # in which case those metrics are reported as not estimable).
  lanl_smoke:
    mode: lanl
    description: >-
      First four days of the LANL 2015 auth file. Pipeline throughput and memory check on real
      data; not an evaluation of detection performance.
    raw_dir: data/raw/lanl
    files:
      auth: auth.txt.gz
      redteam: redteam.txt.gz
    processed_dir: data/processed/lanl_smoke
    artifacts_dir: artifacts/lanl_smoke
    time_window: { start_seconds: 0, end_seconds: 345599 }
    ingest: { block_size_bytes: 67108864, assume_sorted: true, hash_source_files: false }
    redteam: { user_field: source }
    features:
      { window_seconds: 3600, burst_seconds: 300, baseline_windows: 24, principals: users_only,
        chunk_seconds: 3600 }
    graph: { hub_max_principals: 15, sample_events_per_edge: 3, export_max_edges: 60 }
    splits: { warmup_end_day: 1, train_end_day: 2, validation_end_day: 3, test_end_day: 4 }
    seed: 42
