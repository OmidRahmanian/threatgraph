# Live Monitoring Mode (server side). Thresholds and their reasoning: docs/live/incidents.md.
# Secrets never go here: tokens, passwords and bot credentials come from environment variables
# or *_FILE secrets (docs/live/configuration.md). Live data never mixes with research results.

retention:
  event_days: 30            # raw events (logs, auth, admin activity)
  metrics_days: 14          # metric samples, heartbeats, probe results
  incident_days: 365        # resolved incidents (open incidents are never deleted)
  notification_days: 90

ingest:
  max_batch_events: 2000
  max_body_bytes: 5000000
  max_decompressed_bytes: 25000000
  max_events_per_minute_per_agent: 60000
  max_clock_skew_seconds: 86400

services:
  website: { display_name: "Production Website" }
  host: { display_name: "VPS host" }

detection:
  interval_seconds: 60
  lookback_seconds: 900
  agent_offline_after_seconds: 300
  # Sources never alerted on by the HTTP rules (for example your own uptime checker).
  allowlist_sources: []
  # Paths that legitimate visitors of a typical site do not request. Regular expressions.
  sensitive_paths:
    - '^/\.env'
    - '^/\.git(/|$)'
    - '^/\.aws/'
    - '^/\.ssh/'
    - '^/wp-(admin|login|config)'
    - '^/xmlrpc\.php'
    - '^/phpmyadmin'
    - '^/(admin|administrator)/?$'
    - '^/server-status'
    - '^/actuator'
    - '^/cgi-bin/'
    - '^/(backup|db|dump)\.(sql|zip|tar\.gz)$'
    - '\.\./'
    - '^/etc/passwd'
  rules:
    ssh_bruteforce:            { severity: medium, params: { window_seconds: 300, min_failures: 10 } }
    ssh_password_spray:        { severity: medium, params: { window_seconds: 600, min_distinct_users: 5 } }
    ssh_success_after_failures: { severity: high,  params: { window_seconds: 3600, min_failures: 5 } }
    http_recon:                { severity: low,    params: { window_seconds: 300, min_sensitive_hits: 3, min_distinct_404_paths: 25 } }
    http_request_burst:        { severity: low,    params: { window_seconds: 60, min_requests: 600 } }
    http_error_spike:          { severity: medium, params: { window_seconds: 300, min_requests: 30, min_5xx_ratio: 0.25 } }
    request_volume_deviation:  { severity: info,   params: { bucket_seconds: 300, history_hours: 24, min_history_buckets: 48, robust_z: 8.0, min_requests: 200 } }
    availability:              { severity: high,   params: { consecutive_failures: 2, critical_after_seconds: 900 } }
    tls_expiry:                { severity: medium, params: { warn_days: 14, high_days: 3 } }
    service_failure:           { severity: medium }
    container_unhealthy:       { severity: medium }
    kernel_oom:                { severity: medium }
    nginx_worker_crash:        { severity: medium }
    disk_usage:                { severity: high,   params: { high_percent: 90, critical_percent: 97 } }
    memory_pressure:           { severity: medium, params: { percent: 95, sustained_samples: 5 } }
    agent_offline:             { severity: medium }
    privileged_account_change: { severity: high }
    sudo_failure:              { severity: medium, params: { window_seconds: 600, min_failures: 3 } }
    unexpected_admin:          { severity: low,    params: { allowed_sudo_users: [] } }
    file_integrity:            { severity: medium, params: { high_paths: ['/etc/sudoers', '/etc/passwd', '/etc/shadow', '/etc/ssh/sshd_config', '/root/.ssh/authorized_keys'] } }
    behavior_model:            { severity: info }

notifications:
  min_severity: medium      # info and low incidents are visible in the dashboard only
  cooldown_seconds: 3600    # an ongoing incident is re-notified at most once per cooldown
  max_attempts: 6
  retry_base_seconds: 30
  retry_max_seconds: 3600
  recovery_notifications: true
  # dashboard_url: https://monitor.example.com/threatgraph/live/

probes:
  interval_seconds: 60
  targets: []
  # - { name: website, url: "https://example.com/", expect_status: [200], service: website }

ml:
  enabled: true
  bucket_seconds: 300
  min_train_windows: 500
  alert_rate: 0.002
  retrain_hours: 24
  train_days: 7
  validation_days: 1
  seed: 42

llm:
  enabled: false            # optional; detection and alerts never depend on it
  ollama_url: http://ollama:11434
  model: llama3.2:3b
  timeout_seconds: 120
  max_evidence_events: 40
