# Local services: the read-only API and nginx serving the static site.
# Build first: `make demo && make web-build`, then `docker compose up --build`.
# Ports are configurable: TG_API_PORT (default 8000), TG_WEB_PORT (default 8080).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TG_DATASET: ${TG_DATASET:-demo}
      TG_CORS_ORIGINS: http://localhost:${TG_WEB_PORT:-8080}
    ports: ["${TG_API_PORT:-8000}:8000"]
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: nginx:1.27-alpine
    ports: ["${TG_WEB_PORT:-8080}:80"]
    volumes:
      - ./apps/web/out:/usr/share/nginx/html:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
