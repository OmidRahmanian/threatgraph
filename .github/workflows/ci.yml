name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint & format
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy
      - name: Tests (unit + integration)
        run: .venv/bin/pytest
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: uv pip freeze --python .venv/bin/python | grep -v '^-e' > requirements-audit.txt && uvx pip-audit -r requirements-audit.txt

  web:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Build the synthetic demo bundle
        run: .venv/bin/python scripts/run_pipeline.py --dataset demo --seed 42
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run lint && npm run typecheck && npm test
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium && npx playwright test
      - name: npm audit (advisory)
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Build the synthetic demo artifacts and static site
        run: |
          .venv/bin/python scripts/run_pipeline.py --dataset demo --seed 42
          cd apps/web && npm ci && npm run build
      - name: Start the read-only API and nginx
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -sf localhost:8000/api/v1/health | grep '"status":"ok"'
          curl -sf localhost:8000/api/v1/incidents > /dev/null
          curl -sf "localhost:8000/api/v1/graph/windows?split=test" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/summary)" = 405
          curl -sf localhost:8080/threatgraph/replay/ > /dev/null
          curl -sf localhost:8080/threatgraph-data/demo/v1/incidents/index.json > /dev/null
          ! docker compose exec -T api ls /app/data/raw 2>/dev/null
      - name: Start the live monitoring profile (no secrets; dashboard login stays disabled)
        run: docker compose --profile live up -d --build --wait
      - name: Live smoke test (authentication required everywhere)
        run: |
          curl -skf https://localhost/live-api/v1/health | grep '"status":"ok"'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/live-api/v1/overview)" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/ingest/v1/events)" = 404
          curl -skf https://localhost:8443/ingest/v1/health | grep '"status":"ok"'
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost:8443/ingest/v1/events -d '{}')" = 401
          curl -skf https://localhost/api/v1/health > /dev/null
          curl -skf https://localhost/threatgraph/live/ > /dev/null
          docker compose --profile live exec -T live-worker threatgraph-live worker --once > /dev/null
      - if: always()
        run: docker compose --profile live logs && docker compose --profile live down -v
